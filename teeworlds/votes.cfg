# Populates the in-game "Call Vote" menu's map list (Server Control tab,
# under the vote-options listbox) -- otherwise it's empty and there's no
# in-game way to switch maps at all. Any connected client can browse this
# with the right stick (mouse) + A (click) and call a vote; as the only
# player on a local/bot server, your own vote passes immediately.
#
# Covers the 16 official Teeworlds maps. The 1,486 extra community maps
# this port ships aren't listed here (would make for an unwieldy scroll),
# but any of them works the same way -- add more add_vote lines below,
# same "change_map <mapname>" pattern, mapname matching a .map file under
# teeworlds/data/maps/ (no .map extension).

add_vote "dm1" "change_map dm1"
add_vote "dm2" "change_map dm2"
add_vote "dm3" "change_map dm3"
add_vote "dm6" "change_map dm6"
add_vote "dm7" "change_map dm7"
add_vote "dm8" "change_map dm8"
add_vote "dm9" "change_map dm9"
add_vote "ctf1" "change_map ctf1"
add_vote "ctf2" "change_map ctf2"
add_vote "ctf3" "change_map ctf3"
add_vote "ctf4" "change_map ctf4"
add_vote "ctf5" "change_map ctf5"
add_vote "ctf6" "change_map ctf6"
add_vote "ctf7" "change_map ctf7"
add_vote "ctf8" "change_map ctf8"
add_vote "lms1" "change_map lms1"
