[config]
deadzone_triggers = 3000
deadzone_mode = axial
deadzone = 2000
deadzone_scale = 8
mouse_delay = 16

[controls]
a = "space"                 # Jump / OmniOSK confirm (OMNI_CONFIRM_KEY=space)
b = "mouse_right"           # Hook
x = "mouse_left"            # Fire
y = "tab"                   # Scoreboard

l1 = "mouse_wheel_up"       # Previous weapon
r1 = "mouse_wheel_down"     # Next weapon
l2 = hold_state hotkey
r2 = "mouse_left"           # Fire (trigger)

start = "t"                 # Chat
back = hold_state select_hold
guide = "esc"                # Menu

# D-Pad is always arrow keys, not movement. Teeworlds doesn't bind arrows to
# anything while alive (only used for spectator prev/next), so this is inert
# during normal play and doubles as OmniOSK's own default nav keys with zero
# OMNI_*_KEY overrides needed. Movement lives on the left stick instead
# (below) so nothing is lost, but D-Pad-as-movement is gone.
up = "up"
down = "down"
left = "left"
right = "right"

left_analog_left = "a"
left_analog_right = "d"
left_analog_up = "space"
left_analog_down =

right_analog = mouse_movement

[controls:hotkey]
overlay = parent

a = "y"                     # Team chat
b = "x"                     # Whisper
x = "u"                     # Show chat log
y = "e"                     # Statboard

l1 = "f3"                   # Vote yes
r1 = "f4"                   # Vote no
r2 = "f10"                  # Screenshot

start = "leftshift"         # Emoticon
back = "rightshift"         # Spectator mode

# Hold Select: D-Pad Down toggles the on-screen keyboard, B/X reach the two
# OmniOSK actions with no bare-button gameplay use (backspace, charset page).
# Deliberately stateless -- nothing here tracks whether the keyboard is
# currently open, so there's nothing to desync when OmniOSK closes itself
# on Submit. D-Pad nav and the confirm key (space, above) work identically
# whether the overlay is open or not.
[controls:select_hold]
overlay = parent
down = "f12"                # Toggle on-screen keyboard
b = "backspace"
x = "tab"                   # Switch character page (letters/numbers/symbols)
