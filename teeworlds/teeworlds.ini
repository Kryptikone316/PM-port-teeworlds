[config]
deadzone_triggers = 3000
deadzone_mode = scaled_radial
deadzone = 2000
deadzone_scale = 16
mouse_delay = 16

[controls]
a = "mouse_left"            # Fire
b = "mouse_wheel_down"      # Next weapon
x = "space"                 # Jump
y = "mouse_wheel_up"        # Previous weapon

l1 = "mouse_right"          # Hook
r1 = "mouse_left"           # Fire (alt)
l2 = hold_state hotkey
r2 = hold_state spectate_hold

start = "t"                 # Chat / OmniOSK confirm (OMNI_CONFIRM_KEY=t)
back = hold_state select_hold
guide = "esc"                # Menu

# D-Pad is real movement/action now, not arrow keys -- left/right mirror the
# left stick (a/d), up jumps (same key as X), down is a standalone Escape
# (opens Teeworlds' own in-game menu with no modifier needed). OmniOSK's own
# nav/confirm keys are remapped to match via OMNI_*_KEY in Teeworlds.sh,
# since it can no longer assume D-Pad sends plain arrows.
up = "space"
down = "esc"
left = "a"
right = "d"

left_analog_left = "a"
left_analog_right = "d"
left_analog_up = "space"
left_analog_down =

right_analog = mouse_movement

[controls:hotkey]
overlay = parent

a = "y"                     # Team chat
b = "x"                     # Whisper
x = "u"                     # Show chat log
y = "e"                     # Statboard

up = "tab"                  # Scoreboard

l1 = "f3"                   # Vote yes
r1 = "f4"                   # Vote no
r2 = "f10"                  # Screenshot

start = "leftshift"         # Emoticon

# Hold Select: D-Pad Down toggles the on-screen keyboard, B/X reach the two
# OmniOSK actions with no bare-button gameplay use (backspace, charset page).
# Deliberately stateless -- nothing here tracks whether the keyboard is
# currently open, so there's nothing to desync when OmniOSK closes itself
# on Submit. D-Pad nav and the confirm key (t, above) work identically
# whether the overlay is open or not.
[controls:select_hold]
overlay = parent
down = "f12"                # Toggle on-screen keyboard
b = "backspace"
x = "tab"                   # Switch character page (letters/numbers/symbols)

# Hold R2: all spectator-mode functions grouped under one modifier, since
# D-Pad left/right now drive movement instead of spectate prev/next.
[controls:spectate_hold]
overlay = parent
left = "left"                # Spectate previous
right = "right"               # Spectate next
back = "rightshift"           # Toggle spectator mode
