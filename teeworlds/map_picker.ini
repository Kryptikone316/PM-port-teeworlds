[config]
deadzone_triggers = 3000
deadzone_mode = axial
deadzone = 2000
deadzone_scale = 8
mouse_delay = 16

[controls]
a = "enter"                 # Confirm: pick the highlighted map
b = "enter"                 # Confirm (alt) -- A/B mapping isn't reliable
                             # across controllerdb entries, so both confirm,
                             # same reasoning as menu_picker's A/B fix.
x = "f"                     # Toggle favorite on the highlighted map
y = "tab"                   # Switch column focus (Official/Favorites/Others)
guide = "esc"                # Cancel (where present)
l2 = "esc"                   # Cancel (reliable) -- confirmed on real hardware
                             # that Guide isn't mapped in every controllerdb
                             # entry (e.g. the X55's live one has no "guide:"
                             # at all), so L2 is the one guaranteed to work
                             # everywhere; Guide is kept as a bonus alt.

up = "up"                   # Scroll up in the focused column
down = "down"                # Scroll down in the focused column
left = "tab"                 # Same as Y -- only 3 columns, forward-cycle
right = "tab"                # is plenty, no real need for a "previous" bind

left_analog_up = "up"
left_analog_down = "down"

l1 = "pageup"                # Quick-scroll up a screen's worth of rows
r1 = "pagedown"               # Quick-scroll down -- Others has ~685 entries

start = "backspace"          # Clear last typed search character
back = hold_state select_hold

# Same Select+D-Pad-Down chord as the main game, for consistency -- opens
# the on-screen keyboard to search by typing instead of scrolling.
[controls:select_hold]
overlay = parent
down = "f12"
